name: Build Desktop Executables

on:
  push:
    branches:
      - desktop
    paths-ignore:
      - "README.md"
      - "screenshots/**"
      - ".gitignore"
      - "LICENSE"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build for ${{ matrix.os }}
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]'))

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        if: runner.os != 'macOS'
        run: |
          pyinstaller --clean --noconfirm Pong.spec

      - name: Build macOS .app with PyInstaller
        if: runner.os == 'macOS'
        run: |
          pyinstaller --clean --noconfirm Pong.spec

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        run: |
          Compress-Archive `
            -Path dist\Pong.exe `
            -DestinationPath Pong-Windows.zip `
            -Force

      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: |
          tar -czf Pong-Linux.tar.gz -C dist Pong

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Pong Pong-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pong-${{ runner.os }}
          path: |
            Pong-Windows.zip
            Pong-Linux.tar.gz
            Pong-macOS.zip

  release:
    name: Create GitHub Release
    needs: build-desktop

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.${{ github.run_number }}
          name: Pong Desktop v1.0.${{ github.run_number }}
          files: |
            artifacts/Pong-Windows/Pong-Windows.zip
            artifacts/Pong-Linux/Pong-Linux.tar.gz
            artifacts/Pong-macOS/Pong-macOS.zip
